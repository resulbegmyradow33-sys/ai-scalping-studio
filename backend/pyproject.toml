[project]
name = "scalping"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "polars>=1.0",
  "pyarrow>=16",
  "gymnasium>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "stable-baselines3>=2.9.2",
  "torch>=2.15.0",
  "scikit-learn>=1.9.1",
  "hmmlearn>=0.3.3",
  "lightgbm>=4.5",
  "xgboost>=2.1",
]

[project.optional-dependencies]
# Optional: PDF text extraction for knowledge ingestion. The core install and
# the trading runtime never require it; without it a PDF is reported as
# ``status="unsupported"`` with an install hint.
pdf = ["pypdf>=5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scalping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: end-to-end PPO training; deselect with -m 'not slow'",
]
filterwarnings = [
  # Starlette 1.10 warns on import while httpx2 is not installed; the httpx
  # TestClient still works and the warning would otherwise print on every run.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

# Optional extra: mypy must pass on a core install where pypdf is absent.
[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*"]
ignore_missing_imports = true
